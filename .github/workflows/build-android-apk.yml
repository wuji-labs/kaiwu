name: BUILD — Android APK (Kaiwu)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_android_apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
          HAPPIER_INSTALL_SCOPE: "ui,protocol,transfers,agents,connection-supervisor"
        run: |
          set -euo pipefail
          corepack yarn install --frozen-lockfile --network-concurrency 8 || corepack yarn install --network-concurrency 8

      - name: Build internal packages
        run: |
          set -euo pipefail
          corepack yarn build:packages

      - name: Ensure UI workspace packages built
        run: |
          set -euo pipefail
          cd apps/ui
          corepack yarn -s ensure:workspace:built

      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.KAIWU_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 -d > /tmp/kaiwu-release.jks
          ls -lh /tmp/kaiwu-release.jks

      - name: Configure Gradle signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KAIWU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KAIWU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KAIWU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4608m -XX:+UseG1GC
          org.gradle.parallel=false
          android.useAndroidX=true
          android.enableJetifier=true
          KAIWU_RELEASE_STORE_FILE=/tmp/kaiwu-release.jks
          EOF
          cat >> ~/.gradle/gradle.properties << EOFPROPS
          KAIWU_RELEASE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          KAIWU_RELEASE_KEY_ALIAS=${KEY_ALIAS}
          KAIWU_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}
          EOFPROPS

      - name: Prebuild Android project
        env:
          APP_ENV: production
          EXPO_UNSTABLE_WEB_MODAL: "1"
          EXPO_USE_METRO_WORKSPACE_ROOT: "0"
        run: |
          set -euo pipefail
          cd apps/ui
          npx expo prebuild --platform android --no-install

      - name: Patch google-services.json for com.wujilabs.kaiwu
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, copy
          p = "apps/ui/android/app/google-services.json"
          d = json.load(open(p))
          pkgs = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in d.get("client", [])]
          if "com.wujilabs.kaiwu" not in pkgs:
              for c in d.get("client", []):
                  if c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "dev.happier.app":
                      cloned = copy.deepcopy(c)
                      cloned["client_info"]["android_client_info"]["package_name"] = "com.wujilabs.kaiwu"
                      d["client"].append(cloned)
                      break
              json.dump(d, open(p, "w"), indent=2)
              print("Patched google-services.json successfully")
          else:
              print("Already present in google-services.json")
          PYEOF

      - name: Inject release signing config
        run: |
          set -euo pipefail
          cat >> apps/ui/android/app/build.gradle <<'EOF'

          // --- 无极开物 release signing (props from ORG_GRADLE_PROJECT_* env) ---
          android {
              signingConfigs {
                  release {
                      storeFile file(KAIWU_RELEASE_STORE_FILE)
                      storePassword KAIWU_RELEASE_STORE_PASSWORD
                      keyAlias KAIWU_RELEASE_KEY_ALIAS
                      keyPassword KAIWU_RELEASE_KEY_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
          grep -n "KAIWU_RELEASE_STORE_FILE" apps/ui/android/app/build.gradle

      - name: Build Android Release APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ORG_GRADLE_PROJECT_KAIWU_RELEASE_STORE_FILE: /tmp/kaiwu-release.jks
          ORG_GRADLE_PROJECT_KAIWU_RELEASE_STORE_PASSWORD: ${{ secrets.KAIWU_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KAIWU_RELEASE_KEY_ALIAS: ${{ secrets.KAIWU_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KAIWU_RELEASE_KEY_PASSWORD: ${{ secrets.KAIWU_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd apps/ui/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x bundleRelease -x lintVitalRelease -x lintVitalAnalyzeRelease

      - name: Locate APK
        id: locate_apk
        run: |
          set -euo pipefail
          APK_PATH=$(find apps/ui/android -name "*.apk" -path "*/release/*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: No APK found in release build output" >&2
            find apps/ui/android -name "*.apk" -o -name "*.aab" | head -20
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

          echo "=== APK Version Proof ==="
          python3 - << 'PYEOF'
          import zipfile, struct, os, sys
          apk_path = os.environ.get("APK_PATH")
          with zipfile.ZipFile(apk_path) as z:
              data = z.read("AndroidManifest.xml")
          offset = 8
          strings = []
          version_code = None
          version_name = None
          while offset < len(data):
              chunk_type, header_size, chunk_size = struct.unpack_from('<HHI', data, offset)
              if chunk_type == 0x0001:
                  string_count, style_count, flags, strings_start, styles_start = struct.unpack_from('<IIIII', data, offset + 8)
                  is_utf8 = (flags & (1 << 8)) != 0
                  offsets = [struct.unpack_from('<I', data, offset + 28 + i * 4)[0] for i in range(string_count)]
                  pool_data = data[offset + strings_start : offset + chunk_size]
                  for o in offsets:
                      if is_utf8:
                          u8_len = pool_data[o+1]
                          s = pool_data[o+2:o+2+u8_len].decode('utf-8', 'replace')
                      else:
                          u16_len = struct.unpack_from('<H', pool_data, o)[0]
                          s = pool_data[o+2:o+2+u16_len*2].decode('utf-16le', 'replace')
                      strings.append(s)
              elif chunk_type == 0x0102:
                  tag_ns, tag_name = struct.unpack_from('<II', data, offset + 16)
                  if strings[tag_name] == 'manifest':
                      attr_start, attr_size, attr_count = struct.unpack_from('<HHH', data, offset + 24)
                      attr_offset = offset + 16 + attr_start
                      for i in range(attr_count):
                          a_ns, a_name, a_val_str, a_type, a_data = struct.unpack_from('<IIIIHHI', data, attr_offset + i * 20)[:5]
                          name_str = strings[a_name]
                          if name_str == 'versionCode':
                              version_code = a_data
                          elif name_str == 'versionName':
                              version_name = strings[a_val_str] if a_val_str != 0xffffffff else str(a_data)
                      break
              offset += chunk_size
          print(f"versionName: {version_name}, versionCode: {version_code}")
          PYEOF
        env:
          APK_PATH: ${{ steps.locate_apk.outputs.apk_path }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kaiwu-android-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          retention-days: 7
