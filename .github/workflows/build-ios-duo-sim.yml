name: BUILD — iOS Duo Simulator (Kaiwu)

on:
  workflow_dispatch:
  push:
    branches:
      - wuji/duo-*

permissions:
  contents: read

concurrency:
  group: build-ios-duo-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_duo_simulator:
    name: Build and Test on iPhone Duo Simulator
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      # Runtime first, while the disk is still empty: the 27.1 simulator needs ~8 GB.
      - name: Prepare iOS 27.1 simulator runtime
        run: |
          set -euo pipefail
          df -h /
          KEEP="${DEVELOPER_DIR%/Contents/Developer}"
          for x in /Applications/Xcode_*.app; do
            if [ "$x" != "$KEEP" ]; then echo "removing unused $x"; sudo rm -rf "$x"; fi
          done
          df -h /
          if ! xcrun simctl list runtimes | grep -q "iOS 27\.1"; then
            xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes
          df -h /

      - name: Xcode version and Duo simulator availability
        run: |
          set -euo pipefail
          echo "=== Xcode Version (must be 27.1) ==="
          XCODE_VERSION=$(xcodebuild -version | sed -n 1p)
          echo "$XCODE_VERSION"
          if ! echo "$XCODE_VERSION" | grep -q "27\.1"; then
            echo "ERROR: Xcode must be 27.1, got: $XCODE_VERSION" >&2
            exit 1
          fi
          echo "✓ Xcode 27.1 confirmed"

          echo "=== Available iOS SDKs ==="
          xcodebuild -showsdks | grep iphonesimulator || echo "No iphonesimulator SDK found"

          echo "=== Checking for iPhone Duo device types ==="
          xcrun simctl list devicetypes | grep -i duo || echo "No Duo simulator found; will show all available"
          xcrun simctl list devicetypes | sed -n '1,20p'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        run: |
          set -euo pipefail
          corepack yarn install --frozen-lockfile --network-concurrency 8 || corepack yarn install --network-concurrency 8

      - name: Build internal packages
        run: |
          set -euo pipefail
          corepack yarn build:packages

      - name: Ensure UI workspace packages built
        run: |
          set -euo pipefail
          cd apps/ui
          corepack yarn -s ensure:workspace:built

      - name: Release gate (critical tests + typecheck ratchet)
        run: |
          set -euo pipefail
          node scripts/release-critical-tests.mjs

      - name: Prebuild iOS project
        env:
          APP_ENV: production
          EXPO_UNSTABLE_WEB_MODAL: "1"
        run: |
          set -euo pipefail
          cd apps/ui
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          cd apps/ui/ios
          pod install

      - name: Discover workspace and scheme
        id: xcode_meta
        run: |
          set -euo pipefail
          cd apps/ui/ios
          xcodebuild -list -json > xcode_list.json
          cat xcode_list.json
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | sed -n 1p)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found!" >&2
            exit 1
          fi
          SCHEME=$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("xcode_list.json", "utf8"));
            const schemes = data.workspace?.schemes || data.project?.schemes || [];
            const target = schemes.find(s => s.includes("無極開物") || s.includes("无极开物") || s.toLowerCase().includes("kaiwu")) || schemes.find(s => s !== "Pods") || schemes[0];
            if (!target) throw new Error("No scheme found");
            console.log(target);
          ')
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build for iPhone Duo simulator
        env:
          WORKSPACE: ${{ steps.xcode_meta.outputs.workspace }}
          SCHEME: ${{ steps.xcode_meta.outputs.scheme }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -euo pipefail
          cd apps/ui/ios
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -quiet

      - name: Find and list iPhone Duo device type
        id: duo_device
        run: |
          set -euo pipefail
          echo "=== Listing all iPhone Duo device types ==="
          DUO_DEVICE=$(xcrun simctl list devicetypes | grep -i "iphone.*duo" | sed -n 1p | sed 's/.*(\(.*\))/\1/')
          if [ -z "$DUO_DEVICE" ]; then
            echo "No iPhone Duo device type found; attempting fallback..." >&2
            DUO_DEVICE=$(xcrun simctl list devicetypes | grep -i duo | sed -n 1p | sed 's/.*(\(.*\))/\1/')
          fi
          if [ -z "$DUO_DEVICE" ]; then
            echo "ERROR: No Duo device type available" >&2
            xcrun simctl list devicetypes | grep -i "iphone"
            exit 1
          fi
          echo "Found Duo device: $DUO_DEVICE"
          echo "duo_device=$DUO_DEVICE" >> "$GITHUB_OUTPUT"

      - name: Create iPhone Duo simulator
        id: create_sim
        run: |
          set -euo pipefail
          DUO_DEVICE="${{ steps.duo_device.outputs.duo_device }}"
          # The image ships only the iOS 27.0 simulator runtime; iPhone Duo needs the runtime
          # that matches the 27.1 SDK. Download it when missing.
          xcrun simctl list runtimes
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; rs=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"] and r["version"].startswith("27.1")]; print(rs[-1]["identifier"] if rs else "")')
          if [ -z "$RUNTIME" ]; then
            echo "ERROR: no available iOS 27.1 simulator runtime" >&2
            exit 1
          fi
          SIM_UDID=$(xcrun simctl create "kaiwu-duo-test" "$DUO_DEVICE" "$RUNTIME")
          echo "Created simulator: $SIM_UDID"
          echo "sim_udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Boot, install, launch and verify on iPhone Duo
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          APP_PATH=$(find apps/ui/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name "*.app" -type d | sed -n 1p)
          [ -n "$APP_PATH" ] || { echo "ERROR: built .app not found" >&2; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          echo "App: $APP_PATH  bundle: $BUNDLE_ID  exec: $EXEC_NAME"
          /usr/libexec/PlistBuddy -c "Print :UIApplicationSceneManifest" "$APP_PATH/Info.plist"

          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          mkdir -p screenshots
          # Fold controls: record what this simctl actually offers, for the next iteration.
          xcrun simctl help > screenshots/simctl-help.txt 2>&1 || true
          xcrun simctl io "$SIM_UDID" help > screenshots/simctl-io-help.txt 2>&1 || true

          LAUNCH_OUT=$(xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID" -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN)
          echo "$LAUNCH_OUT"
          PID=$(echo "$LAUNCH_OUT" | awk -F': ' '{print $2}')
          sleep 20
          # iPhone Duo: outer display (1398x2034) always; inner (2007x2853) when unfolded.
          # The simulator may boot folded or open, so capture what is lit, then try to light the inner one.
          shoot_all() {  # $1 = tag
            xcrun simctl io "$SIM_UDID" screenshot "screenshots/probe-$1.png" > "screenshots/displays-$1.txt" 2>&1 || true
            cat "screenshots/displays-$1.txt"
            IDS=$( (echo 1; echo 3; grep -Eo -- '--display=[0-9]+' "screenshots/displays-$1.txt" | cut -d= -f2) | sort -u || true)
            for d in $IDS; do
              xcrun simctl io "$SIM_UDID" screenshot --display="$d" "screenshots/duo-$1-display-$d.png" || true
            done
          }
          xcrun simctl io "$SIM_UDID" enumerate > screenshots/enumerate.txt 2>&1 || true
          cat screenshots/enumerate.txt
          shoot_all boot
          ls -la screenshots/
          ls screenshots/duo-*-display-*.png
          xcrun simctl spawn "$SIM_UDID" log show --last 3m --style compact             --predicate "process == \"$EXEC_NAME\"" > screenshots/app-log.txt 2>&1 || true
          tail -60 screenshots/app-log.txt

          # Fail closed: the app process must still be alive and no crash report may exist.
          # No `| grep -q` here: grep exits early, launchctl gets SIGPIPE and pipefail reports a false "not running".
          xcrun simctl spawn "$SIM_UDID" launchctl list > screenshots/launchctl.txt 2>&1 || true
          if ! grep -q "$BUNDLE_ID" screenshots/launchctl.txt; then
            echo "ERROR: $BUNDLE_ID is not running 20s after launch (pid $PID)" >&2
            exit 1
          fi
          # Only this app's own reports (exec "app" must not match e.g. AppIntentsLiveEntityService).
          CRASHES=$(ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -E "^${EXEC_NAME}[-_.]" || true)
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null > screenshots/diagnostic-reports.txt || true
          if [ -n "$CRASHES" ]; then
            echo "ERROR: crash reports found:" >&2; echo "$CRASHES" >&2
            for f in $CRASHES; do cp ~/Library/Logs/DiagnosticReports/"$f" screenshots/; done
            exit 1
          fi
          echo "App alive 20s after launch, no crash reports."

      # Duo pose (closed / partially open / open) is only exposed in DeviceHub
      # (Apple: "Interacting with your app in Device Hub"). Xcode 27 ships DeviceHub.app
      # instead of Simulator.app; drive its "Open" pose through System Events, then shoot the inner display.
      - name: Unfold iPhone Duo through DeviceHub and capture the inner display
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -uo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          # Every AppleScript call is bounded: a TCC consent sheet must never hang the job.
          osa() { perl -e 'alarm shift; exec @ARGV' 45 osascript "$@"; }
          # Pre-authorize Automation (AppleEvents) to System Events / DeviceHub in the user TCC db.
          UTCC="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          NOW2=$(date +%s)
          for c in com.apple.Terminal /usr/bin/osascript /bin/bash; do
            ctype=1; case "$c" in com.*) ctype=0;; esac
            for target in com.apple.systemevents com.apple.dt.DeviceHub com.apple.dt.devicehub; do
              sqlite3 "$UTCC" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier_type, indirect_object_identifier, flags, last_modified) VALUES ('kTCCServiceAppleEvents', '$c', $ctype, 2, 3, 1, 0, '$target', 0, $NOW2);" 2>&1 || true
            done
          done
          TCC="/Library/Application Support/com.apple.TCC/TCC.db"
          NOW=$(date +%s)
          # TCC checks the *responsible* process: grant every executable on our parent chain too.
          CHAIN=""
          pid=$$
          while [ "$pid" -gt 1 ]; do
            exe=$(ps -o comm= -p "$pid" 2>/dev/null | sed 's/^ *//')
            case "$exe" in /*) CHAIN="$CHAIN $exe" ;; esac
            pid=$(ps -o ppid= -p "$pid" 2>/dev/null | tr -d ' ')
            [ -z "$pid" ] && break
          done
          echo "parent chain:$CHAIN"
          for client in /usr/bin/osascript /bin/bash /bin/zsh /bin/sh /usr/libexec/sshd-keygen-wrapper $CHAIN; do
            for svc in kTCCServiceAccessibility kTCCServicePostEvent; do
              sudo sqlite3 "$TCC" "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, indirect_object_identifier, flags, last_modified) VALUES ('$svc', '$client', 1, 2, 4, 1, 'UNUSED', 0, $NOW);" 2>&1 || true
            done
          done
          sudo sqlite3 "$TCC" "SELECT service, client, auth_value FROM access WHERE service IN ('kTCCServiceAccessibility','kTCCServicePostEvent');" 2>&1 || true
          HUB="${DEVELOPER_DIR%/Contents/Developer}/Contents/Applications/DeviceHub.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$HUB/Contents/Info.plist" || true
          open "$HUB" --args -CurrentDeviceUDID "$SIM_UDID" || open "$HUB"
          sleep 15
          PROC=$(osa -e 'tell application "System Events" to get name of every process whose background only is false' 2>&1)
          echo "processes: $PROC"
          HUBPROC=$(echo "$PROC" | tr ',' '\n' | sed 's/^ *//' | grep -i -E "device ?hub" | sed -n 1p)
          echo "hub process: $HUBPROC"
          HUBPROC="${HUBPROC:-DeviceHub}"
          osa -e "tell application \"$HUB\" to activate" 2>&1 || true
          sleep 6
          osa -e "tell application \"System Events\" to tell process \"$HUBPROC\" to get {frontmost, count of windows, count of menu bars}" 2>&1 || true
          # CoreSimulator pose hooks (fallback research): strings that mention pose / hinge.
          CS=/Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/CoreSimulator
          [ -f "$CS" ] && strings "$CS" | grep -i -E "pose|hinge|fold" | sort -u | sed -n '1,60p' > screenshots/coresim-pose-strings.txt || true
          XC="${DEVELOPER_DIR%/Contents/Developer}"
          for bin in $(find "$HUB/Contents" "$XC/Contents/SharedFrameworks" "$XC/Contents/Developer/Library/PrivateFrameworks" /Library/Developer/PrivateFrameworks -maxdepth 4 -type f -perm -u+x 2>/dev/null); do
            if strings "$bin" 2>/dev/null | grep -q -E "PartiallyOpen|partiallyOpen|HingeAngle|hingeAngle|devicePose|DevicePose"; then
              echo "== $bin"
              strings "$bin" | grep -E "PartiallyOpen|partiallyOpen|HingeAngle|hingeAngle|[Pp]ose" | sort -u | sed -n '1,40p'
            fi
          done > screenshots/devicehub-pose-strings.txt 2>&1 || true
          # Dismiss crash/report dialogs ("InputUI quit unexpectedly") from any process.
          osa > screenshots/devicehub-dismiss.txt 2>&1 <<OSA || true
          tell application "System Events"
            set hits to ""
            repeat with p in (every process whose background only is false)
              try
                repeat with w in windows of p
                  try
                    if exists button "Ignore" of w then
                      click button "Ignore" of w
                      set hits to hits & (name of p) & "; "
                    end if
                  end try
                end repeat
              end try
            end repeat
            return "dismissed: " & hits
          end tell
          OSA
          cat screenshots/devicehub-dismiss.txt
          # Dump menus (names) and window buttons (descriptions) so later runs can target exact labels.
          osa > screenshots/devicehub-menus.txt 2>&1 <<OSA || true
          tell application "System Events" to tell process "$HUBPROC"
            set out to ""
            repeat with mm in menus of menu bar 1
              set out to out & "## " & (name of mm) & linefeed
              repeat with mi in menu items of mm
                try
                  set out to out & "  - " & (name of mi) & linefeed
                end try
              end repeat
            end repeat
            set out to out & "## window buttons" & linefeed
            try
              repeat with b in (entire contents of window 1)
                try
                  if role of b is "AXButton" or role of b is "AXRadioButton" then
                    set out to out & "  - " & (role of b) & " | " & (description of b) & " | " & (help of b) & linefeed
                  end if
                end try
              end repeat
            end try
            return out
          end tell
          OSA
          cat screenshots/devicehub-menus.txt
          # Press the "Open" pose: menu item first, then a toolbar button whose description says open.
          osa > screenshots/devicehub-click.txt 2>&1 <<OSA || true
          tell application "System Events" to tell process "$HUBPROC"
            set frontmost to true
            repeat with mm in menus of menu bar 1
              repeat with mi in menu items of mm
                try
                  set n to name of mi
                  if n is "Open" or n is "Fully Open" or n is "Open Device" then
                    click mi
                    return "clicked menu " & (name of mm) & " > " & n
                  end if
                end try
                try
                  repeat with sb in menu items of menu 1 of mi
                    set n to name of sb
                    if n is "Open" or n is "Fully Open" then
                      click sb
                      return "clicked menu " & (name of mm) & " > " & (name of mi) & " > " & n
                    end if
                  end repeat
                end try
              end repeat
            end repeat
            try
              repeat with b in (entire contents of window 1)
                try
                  set d to description of b
                  if (d is "Open" or d is "Fully Open" or d contains "Fully Open") then
                    click b
                    return "clicked button " & d
                  end if
                end try
              end repeat
            end try
            return "no Open control found"
          end tell
          OSA
          cat screenshots/devicehub-click.txt
          WS="$PWD/screenshots"
          cat > /tmp/duo-unfold.applescript <<'OSA'
          on run argv
            set procName to item 1 of argv
            set out to ""
            tell application "System Events"
              tell process procName
                set frontmost to true
                delay 2
                set out to out & "windows=" & (count of windows) & " menubars=" & (count of menu bars) & linefeed
                -- dismiss crash dialogs
                repeat with w in windows
                  try
                    if exists button "Ignore" of w then click button "Ignore" of w
                  end try
                end repeat
                -- menus
                repeat with mm in menus of menu bar 1
                  set out to out & "## " & (name of mm) & linefeed
                  repeat with mi in menu items of mm
                    try
                      set out to out & "  - " & (name of mi) & linefeed
                    end try
                  end repeat
                end repeat
                -- press the Open pose: menu item first
                repeat with mm in menus of menu bar 1
                  repeat with mi in menu items of mm
                    try
                      set n to name of mi
                      if n is "Open" or n is "Fully Open" then
                        click mi
                        return out & "CLICKED menu " & (name of mm) & " > " & n
                      end if
                    end try
                    try
                      repeat with sb in menu items of menu 1 of mi
                        if (name of sb) is "Open" or (name of sb) is "Fully Open" then
                          click sb
                          return out & "CLICKED menu " & (name of mm) & " > " & (name of mi) & " > " & (name of sb)
                        end if
                      end repeat
                    end try
                  end repeat
                end repeat
                -- then any button / radio whose description or help says open
                repeat with b in (entire contents of window 1)
                  try
                    set d to (description of b) as text
                    set h to ""
                    try
                      set h to (help of b) as text
                    end try
                    if d contains "Open" or h contains "Open" then
                      if d does not contain "Partially" and h does not contain "Partially" then
                        click b
                        return out & "CLICKED control " & d & " | " & h
                      end if
                    end if
                  end try
                end repeat
              end tell
            end tell
            return out & "no Open control found"
          end run
          OSA
          printf '#!/bin/bash\nperl -e "alarm 90; exec @ARGV" osascript /tmp/duo-unfold.applescript "%s" > "%s/devicehub-terminal.txt" 2>&1\ntouch "%s/devicehub-terminal.done"\n' "$HUBPROC" "$WS" "$WS" > /tmp/duo-unfold.command
          chmod +x /tmp/duo-unfold.command
          open -a Terminal /tmp/duo-unfold.command
          for i in $(seq 1 60); do [ -f "$WS/devicehub-terminal.done" ] && break; osa -e 'tell application "System Events" to repeat with p in (every process whose background only is false)' -e 'try' -e 'repeat with w in windows of p' -e 'try' -e 'if exists button "Allow" of w then click button "Allow" of w' -e 'if exists button "OK" of w then click button "OK" of w' -e 'end try' -e 'end repeat' -e 'end try' -e 'end repeat' >/dev/null 2>&1 || true; sleep 2; done
          cat "$WS/devicehub-terminal.txt" || true
          osa -e "tell application \"$HUB\" to activate" 2>&1 || true
          sleep 8
          screencapture -x screenshots/runner-desktop.png || true
          for d in 1 3; do
            xcrun simctl io "$SIM_UDID" screenshot --display="$d" "screenshots/duo-hub-display-$d.png" || true
          done
          ls -la screenshots

      - name: Shutdown simulator
        if: always()
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl delete "$SIM_UDID" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: duo-simulator-screenshots
          path: screenshots/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "=== iPhone Duo Simulator Test Summary ==="
          echo "Xcode: $(xcodebuild -version | sed -n 1p)"
          echo "iOS SDK: $(xcodebuild -version | grep 'Build version')"
          if ls screenshots/duo-*-display-*.png >/dev/null 2>&1; then
            echo "✓ Duo screenshot captured"
          else
            echo "✗ Duo screenshot not available"
          fi
          if [ -f "screenshots/inner-screen.png" ]; then
            echo "✓ Inner screen screenshot captured"
          else
            echo "✗ Inner screen screenshot not available"
          fi
