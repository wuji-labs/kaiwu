name: BUILD — iOS Duo Simulator (Kaiwu)

on:
  workflow_dispatch:
  push:
    branches:
      - wuji/duo-*

permissions:
  contents: read

concurrency:
  group: build-ios-duo-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_duo_simulator:
    name: Build and Test on iPhone Duo Simulator
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Xcode version and Duo simulator availability
        run: |
          set -euo pipefail
          xcode-select -p
          xcode-select --switch /Applications/Xcode_27.1_Release_Candidate.app/Contents/Developer
          xcodebuild -version
          echo "=== Checking for iPhone Duo device types ==="
          xcrun simctl list devicetypes | grep -i duo || echo "No Duo simulator found; will show all available"
          xcrun simctl list devicetypes | head -20

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack (Yarn)
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        run: |
          set -euo pipefail
          corepack yarn install --frozen-lockfile --network-concurrency 8 || corepack yarn install --network-concurrency 8

      - name: Build internal packages
        run: |
          set -euo pipefail
          corepack yarn build:packages

      - name: Ensure UI workspace packages built
        run: |
          set -euo pipefail
          cd apps/ui
          corepack yarn -s ensure:workspace:built

      - name: Release gate (critical tests + typecheck ratchet)
        run: |
          set -euo pipefail
          node scripts/release-critical-tests.mjs

      - name: Prebuild iOS project
        env:
          APP_ENV: production
          EXPO_UNSTABLE_WEB_MODAL: "1"
        run: |
          set -euo pipefail
          cd apps/ui
          npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: |
          set -euo pipefail
          cd apps/ui/ios
          pod install

      - name: Discover workspace and scheme
        id: xcode_meta
        run: |
          set -euo pipefail
          cd apps/ui/ios
          xcodebuild -list -json > xcode_list.json
          cat xcode_list.json
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "No .xcworkspace found!" >&2
            exit 1
          fi
          SCHEME=$(node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("xcode_list.json", "utf8"));
            const schemes = data.workspace?.schemes || data.project?.schemes || [];
            const target = schemes.find(s => s.includes("無極開物") || s.includes("无极开物") || s.toLowerCase().includes("kaiwu")) || schemes.find(s => s !== "Pods") || schemes[0];
            if (!target) throw new Error("No scheme found");
            console.log(target);
          ')
          echo "Found workspace: $WORKSPACE, scheme: $SCHEME"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build for iPhone Duo simulator
        env:
          WORKSPACE: ${{ steps.xcode_meta.outputs.workspace }}
          SCHEME: ${{ steps.xcode_meta.outputs.scheme }}
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -euo pipefail
          cd apps/ui/ios
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            -quiet

      - name: Find and list iPhone Duo device type
        id: duo_device
        run: |
          set -euo pipefail
          echo "=== Listing all iPhone Duo device types ==="
          DUO_DEVICE=$(xcrun simctl list devicetypes | grep -i "iphone.*duo" | head -1 | sed 's/.*(\(.*\))/\1/')
          if [ -z "$DUO_DEVICE" ]; then
            echo "No iPhone Duo device type found; attempting fallback..." >&2
            DUO_DEVICE=$(xcrun simctl list devicetypes | grep -i duo | head -1 | sed 's/.*(\(.*\))/\1/')
          fi
          if [ -z "$DUO_DEVICE" ]; then
            echo "ERROR: No Duo device type available" >&2
            xcrun simctl list devicetypes | grep -i "iphone"
            exit 1
          fi
          echo "Found Duo device: $DUO_DEVICE"
          echo "duo_device=$DUO_DEVICE" >> "$GITHUB_OUTPUT"

      - name: Create iPhone Duo simulator
        id: create_sim
        run: |
          set -euo pipefail
          DUO_DEVICE="${{ steps.duo_device.outputs.duo_device }}"
          SIM_UDID=$(xcrun simctl create "kaiwu-duo-test" "$DUO_DEVICE" "iOS27.1")
          echo "Created simulator: $SIM_UDID"
          echo "sim_udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Boot simulator
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          xcrun simctl boot "$SIM_UDID"
          sleep 5
          xcrun simctl bootstatus "$SIM_UDID"

      - name: Install app on simulator
        run: |
          set -euo pipefail
          cd apps/ui/ios
          WORKSPACE="${{ steps.xcode_meta.outputs.workspace }}"
          SCHEME="${{ steps.xcode_meta.outputs.scheme }}"
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          APP_PATH="./build/Build/Products/Release-iphonesimulator/${SCHEME}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App not found at $APP_PATH" >&2
            find ./build -name "*.app" -type d
            exit 1
          fi
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

      - name: Get bundle ID and launch app
        id: app_launch
        run: |
          set -euo pipefail
          cd apps/ui/ios
          WORKSPACE="${{ steps.xcode_meta.outputs.workspace }}"
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          APP_PATH="./build/Build/Products/Release-iphonesimulator/${WORKSPACE%.xcworkspace}.app"

          # Extract bundle ID from Info.plist
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: Info.plist not found" >&2
            exit 1
          fi

          BUNDLE_ID=$(plutil -p "$APP_PATH/Info.plist" | grep CFBundleIdentifier | cut -d' ' -f3 | tr -d '"')
          echo "Bundle ID: $BUNDLE_ID"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

          echo "=== App Info.plist Summary ==="
          plutil -p "$APP_PATH/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleShortVersionString|CFBundleVersion" || true

          # Launch app
          xcrun simctl launch "$SIM_UDID" "$BUNDLE_ID"
          sleep 3

      - name: Check app status and logs (outer screen)
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          BUNDLE_ID="${{ steps.app_launch.outputs.bundle_id }}"

          echo "=== App Process Status ==="
          xcrun simctl spawn "$SIM_UDID" ps aux | grep -i "$BUNDLE_ID" || true

          echo "=== System Log (last 50 lines) ==="
          xcrun simctl spawn "$SIM_UDID" log show --level debug --predicate 'process == "'"$BUNDLE_ID"'"' --last 2m 2>/dev/null | tail -50 || true

      - name: Take screenshot (outer screen)
        id: screenshot_outer
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          mkdir -p screenshots
          OUTER_SCREEN="screenshots/outer-screen.png"
          xcrun simctl io "$SIM_UDID" screenshot "$OUTER_SCREEN" || {
            echo "Note: simctl io screenshot may not be available in preview; attempting simctl status..." >&2
            xcrun simctl status "$SIM_UDID"
          }
          if [ -f "$OUTER_SCREEN" ]; then
            ls -lh "$OUTER_SCREEN"
            echo "outer_screen=$OUTER_SCREEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Toggle and screenshot inner display
        id: screenshot_inner
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          mkdir -p screenshots

          # Attempt to open the device (show inner display)
          echo "Attempting to open device (inner display)..."
          xcrun simctl help | grep -i "open\|fold\|pose" || echo "No fold/pose commands in simctl"

          # Workaround: if simctl has fold support, use it
          if xcrun simctl help 2>&1 | grep -qi "fold\|pose"; then
            xcrun simctl io "$SIM_UDID" open || true
            sleep 2
          fi

          INNER_SCREEN="screenshots/inner-screen.png"
          xcrun simctl io "$SIM_UDID" screenshot "$INNER_SCREEN" || {
            echo "Note: attempting alternative screenshot method..." >&2
          }
          if [ -f "$INNER_SCREEN" ]; then
            ls -lh "$INNER_SCREEN"
            echo "inner_screen=$INNER_SCREEN" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify app is running (no crashes)
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          BUNDLE_ID="${{ steps.app_launch.outputs.bundle_id }}"

          echo "=== Checking for crash logs ==="
          CRASH_LOGS=$(xcrun simctl spawn "$SIM_UDID" find "/Library/Logs/DiagnosticMessages" -name "*$BUNDLE_ID*" -mmin -5 2>/dev/null | wc -l)
          if [ "$CRASH_LOGS" -gt 0 ]; then
            echo "WARNING: Found recent crash logs" >&2
            xcrun simctl spawn "$SIM_UDID" find "/Library/Logs/DiagnosticMessages" -name "*$BUNDLE_ID*" -mmin -5 | head -5
          else
            echo "No recent crash logs found"
          fi

      - name: Shutdown simulator
        if: always()
        run: |
          set -euo pipefail
          SIM_UDID="${{ steps.create_sim.outputs.sim_udid }}"
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl delete "$SIM_UDID" || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: duo-simulator-screenshots
          path: screenshots/
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          set -euo pipefail
          echo "=== iPhone Duo Simulator Test Summary ==="
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "iOS SDK: $(xcodebuild -version | grep 'Build version')"
          if [ -f "screenshots/outer-screen.png" ]; then
            echo "✓ Outer screen screenshot captured"
          else
            echo "✗ Outer screen screenshot not available"
          fi
          if [ -f "screenshots/inner-screen.png" ]; then
            echo "✓ Inner screen screenshot captured"
          else
            echo "✗ Inner screen screenshot not available"
          fi
